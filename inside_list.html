<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel='shortcut icon' href='images/favicone.svg' type='image/x-icon' />
</head>
<body class="inside-list-background">
    <h1 id="list-title"> {listName} </h1>
    <main>
        <button type="button" id="show-item-input-button">Add Item</button>
        <div id="item-editor" hidden>
            <input type="text" id="item-input" placeholder="Enter item...">
            <button type="button" id="add-item-button">Save Item</button>
        </div>
        <button type="button" id="show-topic-input-button">Add Topic</button>
        <div id="topic-editor" hidden>
            <input type="text" id="topic-input" placeholder="Enter topic...">
            <button type="button" id="add-topic-button">Save Topic</button>
        </div>
        <ul id="topic-list" class="topic-list"></ul>
        <div id = "delete-item-button">
             <button type="submit" id = "delete-item-button">delete</button>
        </div>
        <ul id="item-list" class="item-list"></ul>
        <a href="index.html">Back to lists</a>
    </main>
    <script src="java/app.js"></script>
</body>
</html>
