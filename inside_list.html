<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside List</title>
    <link rel="stylesheet" href="inside_list.css">
    <link rel="shortcut icon" href="images/favicone.svg" type="image/x-icon">
</head>
<body class="inside-list-background" data-load-app>
    <div class="app-container">
        <header class="app-header">
            <h1 id="list-title" title="Click to rename">Loading…</h1>
            <div class="inside-list-controls">
                <div class="create-box">
                    <button type="button" class="inside-list-show-item-input-button">Add Item</button>
                    <div id="item-editor" hidden>
                        <input type="text" id="item-input" placeholder="Enter item..." aria-label="Item name" autocomplete="off">
                        <button type="button" id="add-item-button">Save Item</button>
                    </div>
                </div>
                <div class="create-box">
                    <button type="button" class="inside-list-show-topic-input-button">Add Topic</button>
                    <div id="topic-editor" hidden>
                        <input type="text" id="inside-list-topic-input" placeholder="Enter topic..." aria-label="Topic name" autocomplete="off">
                        <button type="button" id="add-topic-button">Save Topic</button>
                    </div>
                </div>
                <div class="inside-list-search">
                    <input type="search" id="item-search" placeholder="Search items..." aria-label="Search items">
                    <button type="button" id="item-search-button">Search</button>
                </div>
            </div>
            <a href="index.html" class="login-button">Back to lists</a>
        </header>

        <main class="inside-list-main">
            <!-- Сюда app.js добавляет и топики, и элементы -->
            <div id="topic-list" class="topic-list"></div>
            <noscript>
                <p>This app needs JavaScript to work. Please enable it in your browser.</p>
            </noscript>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
    <script src="java/account.js"></script>
</body>
</html>
