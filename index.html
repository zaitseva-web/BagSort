<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vortex: create and organize your lists.">
    <title>BagSort</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="images/favicone.svg" type="image/x-icon">
</head>
<body class="index" data-load-app>
    <div class="app-container">

        <!-- Шапка -->
        <header class="app-header">
            <h1 id="top">Lists for you</h1>
            <a href="auth.html" class="login-button">Login</a>
        </header>

        <!-- Блок создания списка -->
        <section class="create-box">
            <p>Create list</p>
            <div class="create-form">
                <input type="text" id="list_name" placeholder="Enter list name..." aria-label="List name" autocomplete="off">
                <button type="button" id="create-list-button">Create</button>
            </div>
        </section>

        <!-- Секция со списками -->
        <section class="lists-section">
            <p>Choose:</p>
            <ul id="lists" class="lists"></ul>
        </section>

        <noscript>
            <p>This app needs JavaScript to work. Please enable it in your browser.</p>
        </noscript>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
    <script src="java/account.js"></script>
</body>
</html>
