<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In and Sign Up</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="images/favicone.svg" type="image/x-icon">
</head>
<body class="auth-page">
<div class="card">

  <!-- Форма входа/регистрации -->
  <div id="guest">
    <h1>Welcome</h1>
    <div class="tabs">
      <button type="button" id="tab-login" class="active">Sign In</button>
      <button type="button" id="tab-signup">Sign Up</button>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@mail.com">
    <label for="password">Password (minimum 8 characters)</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="submit" id="submit" type="button">Sign In</button>
    <button class="link" id="forgot" type="button">Forgot Password?</button>
  </div>

  <!-- Показывается после перехода по ссылке из письма «сброс пароля» -->
  <div id="recovery" hidden>
    <h1>Set a new password</h1>
    <label for="new-password">New password (minimum 8 characters)</label>
    <input id="new-password" type="password" autocomplete="new-password">
    <button class="submit" id="save-password" type="button">Save password</button>
  </div>

  <!-- Показывается после входа -->
  <div id="user" hidden>
    <h1>You are logged in</h1>
    <p>Email: <b id="user-email"></b></p>
    <button class="submit" id="logout" type="button">Logout</button>
  </div>

  <div id="msg" role="status" aria-live="polite"></div>

  <button class="back-button" id="back-home" type="button">Back to Home</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script src="java/account.js"></script>
<script src="java/auth.js"></script>
</body>
</html>
