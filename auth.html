<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In and Sign Up</title>
<link rel="stylesheet" href="style.css">
<link rel='shortcut icon' href='images/favicone.svg' type='image/x-icon' />
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --accent:#2f5bea; --err:#c0392b; --ok:#1e8449; --line:#d9dde4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e8ebf0; --muted:#98a2b3; --accent:#6c8cff; --err:#ff7b6b; --ok:#5fd18a; --line:#2e343d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:none; color:var(--muted); border-radius:8px; font-size:1rem; cursor:pointer; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  label { display:block; font-size:.9rem; margin:12px 0 4px; }
  input { width:100%; padding:11px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .submit { width:100%; margin-top:18px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .submit:disabled { opacity:.6; }
  #msg { min-height:1.3em; margin-top:12px; font-size:.9rem; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  .link { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font-size:.9rem; margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">

  <!-- Форма входа/регистрации -->
  <div id="guest">
    <h1>Welcome</h1>
    <div class="tabs">
      <button type="button" id="tab-login" class="active">Sign In</button>
      <button type="button" id="tab-signup">Sign Up</button>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@mail.com">
    <label for="password">Password (minimum 8 characters)</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="submit" id="submit">Sign In</button>
    <button class="link" id="forgot" type="button">Forgot Password?</button>
  </div>

  <!-- Показывается после входа -->
  <div id="user" hidden>
    <h1>You are logged in</h1>
    <p>Email: <b id="user-email"></b></p>
    <button class="submit" id="logout">Logout</button>
  </div>

  <div id="msg" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<script src="java/account.js"></script>
<script>
  const sb = window.flowSupabaseClient;

  const $ = id => document.getElementById(id);
  const returnUrl = new URL('index.html', window.location.href).href;
  let mode = 'login';

  function say(text, type) { $('msg').textContent = text; $('msg').className = type || ''; }

  function setMode(m) {
    mode = m;
    $('tab-login').classList.toggle('active', m === 'login');
    $('tab-signup').classList.toggle('active', m === 'signup');
    $('submit').textContent = m === 'login' ? 'Sign In' : 'Sign Up';
    $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    say('');
  }
  $('tab-login').onclick = () => setMode('login');
  $('tab-signup').onclick = () => setMode('signup');

  $('submit').onclick = async () => {
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || password.length < 8) return say('Please enter your email and a password with at least 8 characters', 'err');

    $('submit').disabled = true;
    say('Waiting…');

    try {
      const { data, error } = mode === 'signup'
        ? await sb.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: returnUrl }
          })
        : await sb.auth.signInWithPassword({ email, password });

      if (error) return say(error.message, 'err');
      if (mode === 'signup') {
        if (data.session) {
          window.location.replace(returnUrl);
        } else {
          say('Registration successful. Check your email and confirm your address to continue.', 'ok');
        }
      } else {
        window.location.replace(returnUrl);
      }
    } catch (error) {
      say(error instanceof Error ? error.message : 'Registration failed. Please try again.', 'err');
    } finally {
      $('submit').disabled = false;
    }
  };

  $('forgot').onclick = async () => {
    const email = $('email').value.trim();
    if (!email) return say('Please enter your email above', 'err');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    say(error ? error.message : 'email to reset password sent', error ? 'err' : 'ok');
  };

  $('logout').onclick = () => sb.auth.signOut();

  // Следим за состоянием входа (работает и после перезагрузки страницы)
  function render(session) {
    $('guest').hidden = !!session;
    $('user').hidden = !session;
    if (session) { $('user-email').textContent = session.user.email; say(''); }
  }
  sb.auth.getSession().then(({ data }) => render(data.session));
  sb.auth.onAuthStateChange((event, session) => {
    render(session);
    const isAuthCallback = location.hash.includes('access_token=') ||
      new URLSearchParams(location.search).has('code');
    if (event === 'SIGNED_IN' && session && isAuthCallback) {
      window.location.replace(returnUrl);
    }
  });
</script>
</body>
</html>
